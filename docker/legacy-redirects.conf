# Redirects from the old WordPress URLs to their new pages: the news posts (/YYYY/MM/DD/slug/) and
# /downloads/. Included by 40-base-url-redirect.sh only when the site is served at the root.
# The build also writes a forwarding page at each old URL for hosts that can't redirect (GitHub
# Pages): modules/legacy-redirects.ts reads this list.
#
